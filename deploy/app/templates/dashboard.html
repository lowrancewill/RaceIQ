<!DOCTYPE html>
<html>

<head>

    <title>RaceIQ Dashboard</title>

    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1>Telemetry Results</h1>

    <div class="row">

        <div class="col-md-4">

            <div class="card bg-secondary">

                <div class="card-body">

                    <h4>Average Speed</h4>

                    <h2>{{ stats.avg_speed }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-secondary">

                <div class="card-body">

                    <h4>Max Speed</h4>

                    <h2>{{ stats.max_speed }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-secondary">

                <div class="card-body">

                    <h4>Consistency</h4>

                    <h2>{{ stats.consistency }}</h2>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
